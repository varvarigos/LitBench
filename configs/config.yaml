training:
  predefined_graph_path: "robotics.gexf" # path to the graph dataset used for fine-tuning only if downloading option is false
  trainer_args:
    per_device_train_batch_size: 4
    warmup_steps: 100
    num_train_epochs: 1
    learning_rate: 0.0002
    lr_scheduler_type: 'cosine'
    fp16: true
    logging_steps: 1
    report_to: "wandb"
    save_steps: 50
    trainer_output_dir: trainer_outputs/
  tokenizer:
    max_length: 1024
  qlora:
    rank: 8
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:  # modules for which to train lora adapters
    - q_proj
    - k_proj
    - v_proj
    - o_proj

inference:
  pretrained_model: "models/Robotics/Meta-LLama-3-8B-Quantative-Robotics" # used only if training option is false
  generation_args:
    max_new_tokens: 1000
    do_sample: True
    top_p: 0.9
    top_k: 50
    temperature: 0.7
    no_repeat_ngram_size: 2
    num_beams: 1

data_downloading:
  working_directory: "quant_bio_retrieval/"
  gexf_file: "test_graph.gexf" # name of the graph file that will be created only if downloading option is true

processing:
  random_seed: 10
  keep_unstructured_content: false

# Used only if training option is true to save and load the fine-tuned model
model_saving:
  model_name: llama_1b_qlora_uncensored
  base_model: meta-llama/Llama-3.2-1B-Instruct # meta-llama/Meta-Llama-3-8B
  model_output_dir: models   # model saved in {model_output_dir}/{model_name}
  instruction_model: meta-llama/Llama-3.1-8B-Instruct
  index: 1

retriever:
  embedder: BAAI/bge-large-en-v1.5
  num_retrievals: 30000
  arxiv_embeds_download: True # download arxiv embeddings if true else generate them; if already downloaded/generated, they will not be generated again
